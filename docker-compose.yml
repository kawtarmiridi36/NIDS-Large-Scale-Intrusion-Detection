
services:
  master:
    image: nids-node:1.2
    container_name: nids-master
    hostname: master
    restart: unless-stopped

    command: ["/bin/bash", "/opt/nids/scripts/start-master.sh"]

    mem_limit: 3g
    cpus: 1.5

    ports:
      - "9870:9870"
      - "8088:8088"
      - "18080:18080"

    volumes:
      # Hadoop configuration
      - ./config/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./config/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ./config/hadoop/yarn-site.xml:/opt/hadoop/etc/hadoop/yarn-site.xml:ro
      - ./config/hadoop/mapred-site.xml:/opt/hadoop/etc/hadoop/mapred-site.xml:ro

      # Spark configuration
      - ./config/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./config/spark/spark-env.sh:/opt/spark/conf/spark-env.sh:ro

      # Persistent NameNode storage
      - ./data/hdfs/namenode:/data/hdfs/namenode

      # Spark logs
      - ./data/spark-logs:/opt/spark/logs

      # Startup scripts
      - ./docker/scripts:/opt/nids/scripts:ro

    networks:
      - nids-net

  worker:
    image: nids-node:1.2
    hostname: worker
    restart: unless-stopped

    command: ["/bin/bash", "/opt/nids/scripts/start-worker.sh"]

    mem_limit: 3g
    cpus: 2.0

    depends_on:
      - master

    volumes:
      # Hadoop configuration
      - ./config/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./config/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ./config/hadoop/yarn-site.xml:/opt/hadoop/etc/hadoop/yarn-site.xml:ro
      - ./config/hadoop/mapred-site.xml:/opt/hadoop/etc/hadoop/mapred-site.xml:ro

      # Spark configuration
      - ./config/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./config/spark/spark-env.sh:/opt/spark/conf/spark-env.sh:ro

      # Persistent DataNode storage
      - ./data/hdfs/datanode:/data/hdfs/datanode

      # Startup scripts
      - ./docker/scripts:/opt/nids/scripts:ro

    networks:
      - nids-net

networks:
  nids-net:
    external: true
